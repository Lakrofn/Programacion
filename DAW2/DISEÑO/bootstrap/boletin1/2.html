<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .verde {
            background-color: green;
        }

        .rojo {
            background-color: red;
        }

        .rosa {
            background-color: pink;
        }

        .azul {
            background-color: blue;
            min-height: 60px;

        }

        .naranja {
            background-color: orange;
            min-height: 120px;

        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <header class="verde mb-2 mt-2 p-3"></header>

        <div class="row">

            <div class="col-md-2 d-none d-md-block">
                <div class="rojo h-100 p-3"></div>
            </div>

            <div class="col-12 col-md-10">

                <div class="row mb-2 mt-2">
                    <div class="col-12">
                        <div class="rosa h-100 p-3"></div>
                    </div>

                </div>

                <div class="row g-2">
                    <div class="col-12 col-md-6">
                        <div class="naranja h-100 p-2"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="naranja h-100 p-3"></div>
                    </div>
                </div>

                <div class="row g-2 mt-2">
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-4">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-4">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="verde p-3 mt-2"></footer>
    </div>
</body>

</html>
