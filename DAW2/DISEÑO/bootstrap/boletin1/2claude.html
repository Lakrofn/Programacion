<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Layout responsive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .verde {
            background: #00ff00;
        }

        .rojo {
            background: #ff0000;
        }

        .magenta {
            background: #ff00ff;
        }

        .naranja {
            background: #ff9955;
            min-height: 120px;
        }

        .azul {
            background: #0000ff;
            min-height: 60px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">

        <header class="verde p-3 mb-2"></header>

        <div class="row">

            <aside class="col-12 col-sm-2 mb-2">
                <div class="rojo h-100 p-3"></div>
            </aside>

            <main class="col-12 col-sm-10">

                <div class="row mb-2">
                    <div class="col-12">
                        <div class="magenta p-3"></div>
                    </div>
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-12 col-md-6">
                        <div class="naranja"></div>
                    </div>
                    <div class="col-12 col-md-6">
                        <div class="naranja"></div>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-4">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>

                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-4">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                    <div class="col-6 col-sm-4 col-md-2">
                        <div class="azul"></div>
                    </div>
                </div>

            </main>
        </div>

        <footer class="verde p-2 mt-2"></footer>

    </div>

</body>

</html>
